{% extends "base.html" %}

{% block title %}Create Account - ESTATEIQ{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="eq-card p-4 shadow-lg border-2" style="border-color: #0A192F;">
        <div class="text-center mb-4">
          <div class="stat-icon mx-auto mb-2" style="width: 54px; height: 54px; font-size: 1.6rem;">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h3 class="fw-bold text-navy mb-1">Create ESTATEIQ Account</h3>
          <p class="small text-muted mb-0">Join the AI-powered real estate valuation network.</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
          <div class="mb-3">
            <label class="form-label">Full Name <span class="text-danger">*</span></label>
            <input type="text" name="full_name" class="form-control" placeholder="e.g. Ramesh Kumar" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email Address <span class="text-danger">*</span></label>
            <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password <span class="text-danger">*</span></label>
            <input type="password" name="password" class="form-control" placeholder="Create strong password" required>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label">Phone Number</label>
              <input type="text" name="phone" class="form-control" placeholder="+91 XXXXX XXXXX">
            </div>
            <div class="col-6">
              <label class="form-label">City</label>
              <input type="text" name="city" class="form-control" placeholder="e.g. Bengaluru">
            </div>
          </div>

          <button type="submit" class="btn btn-navy w-100 py-2 fw-bold mb-3 shadow-sm">
            <i class="fa-solid fa-id-card me-2"></i> Register Account
          </button>
        </form>

        <div class="text-center mt-3 small">
          Already registered? <a href="{{ url_for('login') }}" class="text-warning fw-bold text-decoration-none">Sign In Here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
